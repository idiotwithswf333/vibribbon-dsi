name: Build DSi

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      # Calico (libnds 2.x) is a separate library and must be linked last.
      - name: Fix link flags
        run: |
          sed -i -E 's/^LIBS[[:space:]]*:=.*/LIBS     := -lfat -lnds9 -lcalico_ds9/' Makefile
          grep -n '^LIBS' Makefile

      - name: Build
        run: make

      - name: Mark as DSi-enhanced
        run: python3 tools/dsi_header.py vibribbon.nds

      - uses: actions/upload-artifact@v4
        with:
          name: vibribbon-nds
          path: vibribbon.nds
