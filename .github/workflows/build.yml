name: Build DSi

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      # libnds 2.x uses Calico: new startup spec + Calico library (linked last).
      - name: Fix link flags
        run: |
          sed -i -E 's#-specs=[^ ]+\.specs#-specs=/opt/devkitpro/calico/share/ds9.specs#' Makefile
          ls -l /opt/devkitpro/calico/share/ds9.specs
          sed -i -E 's/^LIBS[[:space:]]*:=.*/LIBS     := -lfat -lnds9 -lcalico_ds9/' Makefile
          grep -n 'specs\|^LIBS' Makefile

      - name: Build
        run: make

      - name: Mark as DSi-enhanced
        run: python3 tools/dsi_header.py vibribbon.nds

      - uses: actions/upload-artifact@v4
        with:
          name: vibribbon-nds
          path: vibribbon.nds
